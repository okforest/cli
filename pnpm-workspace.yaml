packages:
  - packages/*

# Every dependency version is declared once here and referenced as `catalog:`
# in each package.json; pnpm publish substitutes the concrete range at pack
# time. `catalogMode: strict` (below) keeps it that way.
catalog:
  # Exact, not caret, per https://biomejs.dev/internals/versioning/.
  "@biomejs/biome": 2.6.4
  "@cfworker/json-schema": ^4.1.3
  "@changesets/cli": ^3.0.3
  # Optional peers of @okforest/validate (diagram syntax checks); dev-only here.
  "@d2lang/d2": ^0.1.34
  "@types/mdast": ^4.0.4
  "@types/node": ^26.6.6
  "@vitest/coverage-v8": ^5.0.5
  ajv: ^8.20.0
  mdast-util-from-markdown: ^2.1.0
  mdast-util-gfm-footnote: ^2.1.0
  mermaid: ^12.2.0
  micromark-extension-gfm-footnote: ^2.1.0
  tsdown: ^0.23.4
  turbo: ^2.11.10
  typescript: ^7.0.2
  vitest: ^5.0.5
  yaml: ^2.9.1

# `strict` makes `pnpm add` / `pnpm update` write every dependency to the
# catalog and reference it as `catalog:`, rejecting versions outside it, so
# `pnpm -r update --latest` bumps only this file.
catalogMode: strict

# Supply-chain cooling-off gate, explicit so local and CI agree: only install
# dependency versions at least 24h old. First-party @okforest packages are
# excluded so a fresh publish can be consumed immediately.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@okforest/*"
  - okforest

# Dependencies whose install/build scripts may run. pnpm blocks all others;
# none are needed today (the tsdown/vitest toolchain ships prebuilt binaries).
# Add an entry, with a comment saying why, only when an install requires it.
allowBuilds: {}

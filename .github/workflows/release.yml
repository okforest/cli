name: Release

# Changesets flow: merging changeset files into main opens/updates a
# "Version Packages" PR; merging THAT PR publishes to npm via trusted
# publishing (GitHub Actions OIDC — no long-lived token). Each package's npm
# settings name this repo + workflow as its trusted publisher; the first
# publish of each package is done by hand (see CONTRIBUTING.md). The publish
# command is pnpm-based so workspace:* and catalog: ranges are resolved at
# pack time; `changeset git-tag` reports the tags to the action, which pushes
# them and creates the GitHub Releases. Provenance comes from the OIDC flow.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm release

      # Changesets creates one GitHub Release per package seconds apart, and
      # GitHub marks whichever lands last as Latest. Pin Latest to the CLI's
      # release, the one users install. The packages version in lockstep, so
      # every release that publishes includes an okforest@<version> release.
      - name: Mark the CLI release as Latest
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version packages/okforest/package.json)
          if gh release view "okforest@$VERSION" >/dev/null 2>&1; then
            gh release edit "okforest@$VERSION" --latest
          fi

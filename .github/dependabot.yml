version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    # One PR a week; merging it publishes nothing until a changeset ships it.
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 10

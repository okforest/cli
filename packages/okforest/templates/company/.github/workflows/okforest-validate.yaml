name: OKForest Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Annotates each finding on its file and line, lists them all in the job
      # summary, and checks D2 and Mermaid diagram syntax. Fails on OKF errors;
      # warnings are reported without failing. Inputs and outputs:
      # https://github.com/okforest/validate-action
      - uses: okforest/validate-action@v1
